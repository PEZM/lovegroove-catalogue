# Builds the vinyl catalogue from Discogs' monthly CC0 data dump and uploads it to R2.
#
# Manual backup only. Discogs' download site (behind Cloudflare's bot protection) answers
# GitHub's servers with 403 Forbidden, so the monthly build runs on a Mac instead; see
# mac/README.md. This workflow is kept in case Discogs allows cloud downloads again.
#
# Needs repository secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY
# (an R2 API token with Object Read & Write on the lovegroove-catalogue bucket).
name: Build catalogue

on:
  workflow_dispatch:
    inputs:
      dump:
        description: "Dump date, e.g. 20261101 (empty = 1st of this month)"
        required: false
      key:
        description: "Where to put it in the R2 bucket"
        required: false
        default: "vinyl/current.pack"
      limit:
        description: "Stop after this many releases (0 = whole dump)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: build-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WORK: /mnt/catalogue
      # Empty inputs fall back to the defaults.
      KEY: ${{ inputs.key || 'vinyl/current.pack' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the R2 key works
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the newer default checksums on multipart uploads.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Secrets pasted with a trailing space or line break still work.
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          export AWS_ACCESS_KEY_ID="$(trim "$R2_ACCESS_KEY_ID")" AWS_SECRET_ACCESS_KEY="$(trim "$R2_SECRET_ACCESS_KEY")"
          ENDPOINT="https://$(trim "$R2_ACCOUNT_ID").r2.cloudflarestorage.com"
          # Fail in seconds, not after the 40-minute build, if the key or bucket is wrong.
          aws --version
          aws s3 ls s3://lovegroove-catalogue/vinyl/ \
            --endpoint-url "$ENDPOINT"
          echo "R2 key OK"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Pick dump
        id: dump
        run: |
          DUMP="${{ inputs.dump }}"
          if [ -z "$DUMP" ]; then DUMP="$(date -u +%Y%m01)"; fi
          echo "dump=$DUMP" >> "$GITHUB_OUTPUT"
          echo "Dump $DUMP -> $KEY"

      - name: Read dump and keep vinyl
        run: |
          # Discogs' server can't resume a download, so if it drops, start again (up to 3 tries).
          for TRY in 1 2 3; do
            if python3 build_catalogue.py --dump "${{ steps.dump.outputs.dump }}" \
                 --limit "$LIMIT" --out "$WORK/catalogue.sqlite"; then
              break
            fi
            if [ "$TRY" = 3 ]; then echo "::error::Reading the Discogs dump failed 3 times."; exit 1; fi
            echo "::warning::Reading the dump failed (try $TRY); retrying in 5 minutes."
            sleep 300
          done
          ls -la "$WORK"

      - name: Check it looks complete
        run: |
          # Don't replace a good catalogue with a broken one (November 2026: 8.1 million).
          KEPT=$(python3 -c "import sqlite3; print(sqlite3.connect('$WORK/catalogue.sqlite').execute(\"SELECT value FROM meta WHERE key='vinyl_kept'\").fetchone()[0])")
          echo "Vinyl pressings kept: $KEPT"
          if [ "$LIMIT" = "0" ] && [ "$KEPT" -lt 7000000 ]; then
            echo "::error::Only $KEPT vinyl pressings; expected over 7 million. Not uploading."
            exit 1
          fi

      - name: Pack for R2
        env:
          TMPDIR: /mnt/catalogue
        run: |
          python3 pack_catalogue.py --db "$WORK/catalogue.sqlite" --out "$WORK/catalogue.pack"
          rm "$WORK/catalogue.sqlite"
          ls -la "$WORK"; df -h /mnt

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the newer default checksums on multipart uploads.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Secrets pasted with a trailing space or line break still work.
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          export AWS_ACCESS_KEY_ID="$(trim "$R2_ACCESS_KEY_ID")" AWS_SECRET_ACCESS_KEY="$(trim "$R2_SECRET_ACCESS_KEY")"
          ENDPOINT="https://$(trim "$R2_ACCOUNT_ID").r2.cloudflarestorage.com"
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp "$WORK/catalogue.pack" "s3://lovegroove-catalogue/$KEY" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/octet-stream --no-progress
